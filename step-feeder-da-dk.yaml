################################
#            SCRIPT            #
################################

script:
  - id: scheduled_feed
    mode: queued
    parameters:
      slot: int
    then:
      - script.execute: update_next_feed_time
      - if:
          condition:
            lambda: |-
              if (slot < 1 || slot > 5) return false;
              auto now = id(sntp_time).now();
              if (!now.is_valid()) return false;
              esphome::switch_::Switch* days[] = {nullptr, id(feed_day_sun), id(feed_day_mon),
                id(feed_day_tue), id(feed_day_wed), id(feed_day_thu), id(feed_day_fri), id(feed_day_sat)};
              esphome::switch_::Switch * en[] = {id(feed_time_1_enabled), id(feed_time_2_enabled),
                id(feed_time_3_enabled), id(feed_time_4_enabled), id(feed_time_5_enabled)};
              return en[slot-1]->state && days[now.day_of_week]->state && !id(pause_mode).state;
          then:
            - script.wait: feed_fish
            - script.execute:
                id: feed_fish
                amount: !lambda |-
                  esphome::number::Number* a[] = {id(feed_amount_1), id(feed_amount_2),
                    id(feed_amount_3), id(feed_amount_4), id(feed_amount_5)};
                  return (int) a[slot-1]->state;
                mode: !lambda |-
                  esphome::select::Select* m[] = {id(feed_mode_1), id(feed_mode_2),
                    id(feed_mode_3), id(feed_mode_4), id(feed_mode_5)};
                  return m[slot-1]->current_option();
            - script.wait: feed_fish

  - id: update_backlight
    mode: restart
    parameters:
      force: bool
    then:
      - lambda: |-
          if (force) id(last_backlight) = -1.0f;
          if (!id(auto_dim_enabled).state) return;
          auto now = id(sntp_time).now();
          if (!now.is_valid() || !id(night_start).has_state() || !id(night_end).has_state()) return;
          int now_mins = now.hour * 60 + now.minute;
          auto ns = id(night_start).state_as_esptime();
          auto ne = id(night_end).state_as_esptime();
          int start = ns.hour * 60 + ns.minute;
          int end = ne.hour * 60 + ne.minute;
          bool night = (start < end) ? (now_mins >= start && now_mins < end)
                                     : (now_mins >= start || now_mins < end);
          float target = (night ? id(night_brightness).state : id(day_brightness).state) / 100.0f;
          if (fabsf(target - id(last_backlight)) < 0.001f) return;
          id(last_backlight) = target;
          auto call = id(display_backlight).turn_on();
          call.set_brightness(target);
          call.perform();

  - id: feed_fish

    mode: single

    parameters: 
      amount: int
      mode: std::string

    then:
      - lambda: 'id(feeding) = true;'

      - repeat:
          count: !lambda 'return amount;'

          then:
            - servo.write:
                id: my_servo
                level: !lambda |-
                  return(
                    mode == "${mode_extra}" ? id(extra_level).state :
                    id(normal_level).state
                  ) / 100.0;

            - delay: 650ms

            - servo.write: 
                id: my_servo
                level: !lambda 'return id(stop_level).state / 100.0;'

            - delay: 650ms

      - delay: 650ms

      - servo.detach: my_servo

      - lambda: 'id(feeding) = false;'

      - homeassistant.event: 
          event: esphome.fish_feed
          data:
            device: ${friendly_name}
            amount: !lambda 'return std::to_string(amount);'
            mode: !lambda 'return mode;'
            timestamp: !lambda |-
              auto t = id(sntp_time).now();
              if (!t.is_valid()) return std::string("");
              char buf[20];
              snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:%02d:%02d",
              t.year, t.month, t.day_of_month,
              t.hour, t.minute, t.second);
              return std::string(buf);

      - lambda: |-
          id(total_feeds)++;
          id(total_feed).publish_state(id(total_feeds));
          auto t = id(sntp_time).now();
          if (t.is_valid()) {
            id(last_feed_ts) = (uint32_t) t.timestamp;
            id(last_feed_sensor).publish_state(
              ESPTime::from_epoch_utc(t.timestamp).strftime("${ts_format}"));
          }

  - id: update_next_feed_time
    mode: restart
    then: 
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) return;

          int now_mins = now.hour * 60 + now.minute;

          bool day_ok[8] = {
            false,
            id(feed_day_sun).state,
            id(feed_day_mon).state,
            id(feed_day_tue).state,
            id(feed_day_wed).state,
            id(feed_day_thu).state,
            id(feed_day_fri).state,
            id(feed_day_sat).state,
          };

          struct Entry {
            esphome::datetime::TimeEntity* e;
            esphome::switch_::Switch* sw;
            esphome::number::Number* amount;
            esphome::select::Select* mode;
          };

          Entry times[] = {
            {id(feed_time_1), id(feed_time_1_enabled), id(feed_amount_1), id(feed_mode_1)},
            {id(feed_time_2), id(feed_time_2_enabled), id(feed_amount_2), id(feed_mode_2)},
            {id(feed_time_3), id(feed_time_3_enabled), id(feed_amount_3), id(feed_mode_3)},
            {id(feed_time_4), id(feed_time_4_enabled), id(feed_amount_4), id(feed_mode_4)},
            {id(feed_time_5), id(feed_time_5_enabled), id(feed_amount_5), id(feed_mode_5)},
          };

          int best_mins = -1;
          int best_diff = 99999;
          int best_offset = -1;
          int best_idx = -1;
          for (int day_offset = 0; day_offset <= 7; day_offset++) {
            int dow = (now.day_of_week - 1 + day_offset) % 7 + 1;
            if (!day_ok[dow]) continue;

            for (int i = 0; i < 5; i++) {
              auto& t = times[i];
              if (!t.e->has_state() || !t.sw->state) continue;
              auto et = t.e->state_as_esptime();
              int mins = day_offset * 1440 + et.hour * 60 + et.minute;
              int diff = mins - now_mins;
              if (diff <= 0) continue;
              if (diff < best_diff) {
                best_diff = diff;
                best_mins = et.hour * 60 + et.minute;
                best_offset = day_offset;
                best_idx = i;
              }
            }
            if (best_mins >= 0) break;
          }

          if (best_mins >= 0) {
            ESPTime t = now;
            for (int d = 0; d < best_offset; d++) t.increment_day();
            t.hour = best_mins / 60;
            t.minute = best_mins % 60;
            t.second = 0;
            t.recalc_timestamp_local();
            id(next_feed_ts) = t.timestamp;
            id(next_feed_amount) = (int) times[best_idx].amount->state;
            id(next_feed_mode) = times[best_idx].mode->current_option();
            id(next_feed_sensor).publish_state(
              ESPTime::from_epoch_utc(t.timestamp).strftime("${ts_format}"));
          } else {
            id(next_feed_ts) = 0;
            id(next_feed_amount) = 0;
            id(next_feed_mode) = "";
            id(next_feed_sensor).publish_state("");
          }


