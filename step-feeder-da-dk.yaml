################################
#           GLOBALS            #
################################

globals:
  - id: feeding
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: total_feeds
    type: int
    restore_value: true
    initial_value: '0'

  - id: next_feed_day
    type: int
    restore_value: true
    initial_value: '-1'

  - id: next_feed_amount
    type: int
    restore_value: true
    initial_value: '0'

  - id: next_feed_mode
    type: std::string
    restore_value: true
    initial_value: '""'


################################
#            FONT              #
################################

font:
  - file: "fonts/NotoSans-Bold.ttf"
    id: font_small
    size: 20
    glyphs: " 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzæøåÆØÅ:%.-/"
  - file: "fonts/NotoSans-Regular.ttf"
    id: font_medium
    size: 28
    glyphs: " 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzæøåÆØÅ:%.-/"

  - file: "fonts/NotoSans-Regular.ttf"
    id: font_large
    size: 42
    glyphs: " 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzæøåÆØÅ:%.-/"

  - file: "fonts/NotoSans-Bold.ttf"
    id: font_big
    size: 52
    glyphs: "0123456789:"

################################
#           DISPLAY            #
################################

spi:
  clk_pin: ${display_scl_pin}
  mosi_pin: ${display_sda_pin}

display:
  - platform: mipi_spi
    model: "ST7789V"
    cs_pin: ${display_cs_pin}
    dc_pin: ${display_dc_pin}
    reset_pin: ${display_res_pin}
    dimensions:
      width: 240
      height: 280
      offset_width: 0
      offset_height: 20
    update_interval: 1s
    rotation: 0

    color_depth: 16
    invert_colors: true

    lambda: |-

      int rssi = id(wifi_rssi).has_state() ? id(wifi_rssi).state : -100;

      it.print(
        52, 0,
        id(font_small),
        Color(200, 200, 200),
        TextAlign::TOP_CENTER,
        "${display_wifi}"
      );

      it.printf(
        120, 0,
        id(font_small),
        Color(200, 200, 200),
        TextAlign::TOP_CENTER,
        "%d dB",
        rssi
      );

      int bars = 0;
      if (rssi > -50) bars = 5;
      else if (rssi > -60) bars = 4;
      else if (rssi > -67) bars = 3;
      else if (rssi > -75) bars = 2;
      else if (rssi > -85) bars = 1;
      else bars = 0;

      int x = 175;
      int y = 12;
      int bar_w = 4;
      int gap = 3;
      it.filled_rectangle(
        0, 24,
        240, 1,
        Color(80, 80, 80)
      );
      for (int i = 0; i < 5; i++) {
        int h = 8 + i * 2;
        Color col = (i < bars)
          ? Color(255,255,255)
          : Color(90, 90, 90);
        
        it.filled_rectangle(
          x + i * (bar_w + gap),
          y + (10 - h),
          bar_w,
          h,
          col
        );
      }

      auto now = id(sntp_time).now();

      if (now.is_valid()) {
        it.strftime(
          120, 15,
          id(font_big),
          Color(0,200,255),
          TextAlign::TOP_CENTER,
          "%H:%M:%S",
          now
        );
      }

      it.print(
        120, 70,
        id(font_large),
        Color(id(feeding) ? 255 : id(pause_mode).state ? 255 : 0,
               id(feeding) ? 180 : id(pause_mode).state ? 100 : 255,
               0),
        TextAlign::TOP_CENTER,
        id(feeding) ? "${display_feeding}" : id(pause_mode).state ? "${display_pause}" : "${display_ready}"
      );

      it.print(
        120, 120,
        id(font_medium),
        Color(255, 220, 0),
        TextAlign::TOP_CENTER,
        "${display_next_feeding}"
      );

      if (id(next_feed_datetime).has_state() && id(next_feed_day) >= 0) {
        auto now2 = id(sntp_time).now();
        const char* day_names[] = {
          "",
          "${display_sunday}",
          "${display_monday}",
          "${display_tuesday}",
          "${display_wednesday}",
          "${display_thursday}",
          "${display_friday}",
          "${display_saturday}"
          };
        bool same_day = now2.is_valid() && (now2.day_of_week == id(next_feed_day));


        auto t = id(next_feed_datetime).state_as_esptime();
        if (same_day) {
          it.print(
            120, 150,
            id(font_medium),
            Color(255, 220, 0),
            TextAlign::TOP_CENTER,
            "${display_today}"
          );
          it.strftime(
            120, 175,
            id(font_large),
            Color(255, 220, 0),
            TextAlign::TOP_CENTER,
            "%H:%M",
            t
          );
        } else {
          auto now3 = id(sntp_time).now();
          int tomorrow_dow = (now3.day_of_week % 7) + 1;
          bool is_tomorrow = now3.is_valid() && (id(next_feed_day) == tomorrow_dow);
          it.print(
            120, 150,
            id(font_medium),
            Color(255, 220, 0),
            TextAlign::TOP_CENTER,
            is_tomorrow ? "${display_tomorrow}" : day_names[id(next_feed_day)]
          );
          it.strftime(
            120, 175,
            id(font_large),
            Color(255, 220, 0),
            TextAlign::TOP_CENTER,
            "%H:%M",
            t
          );
        }
        it.printf(
          120, 220,
          id(font_small),
          Color(255, 220, 0),
          TextAlign::TOP_CENTER,
          "${display_amount}: %d",
          id(next_feed_amount)
        );
        it.printf(
          120, 250,
          id(font_small),
          Color(255, 220, 0),
          TextAlign::TOP_CENTER,
          "${display_mode}: %s",
          id(next_feed_mode).c_str()
        );
      } else {
        it.print(
          120, 225,
          id(font_large),
          Color(255, 220, 0),
          TextAlign::TOP_CENTER,
          "--:--"
        );
      }

################################
#           OUTPUT             #
################################

output:
  - platform: ledc
    id: pwm_output
    pin: ${servo_pin}
    frequency: 50Hz
    channel: 0
  - platform: ledc
    pin: ${display_blk_pin}
    id: backlight_pwm
    frequency: 1000Hz
    channel: 8


################################
#             LIGHT            #
################################

light:
  - platform: monochromatic
    output: backlight_pwm
    id: display_backlight
    restore_mode: ALWAYS_ON
    name: ${screen_brightness}
    default_transition_length: 0s


################################
#            SERVO             #
################################

servo:
  - id: my_servo
    output: pwm_output

    min_level: ${servo_min_level}
    max_level: ${servo_max_level}


################################
#            SWITCH            #
################################

switch:
  - platform: template
    id: pause_mode
    name: ${mode_pause}
    icon: mdi:pause-circle-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action: 
      then:
        - delay: 100ms
        - script.execute: update_next_feed_time
