################################
#            SCRIPT            #
################################

script:
  - id: feed_fish

    mode: single

    parameters: 
      amount: int
      mode: std::string

    then:
      - lambda: 'id(feeding) = true;'

      - repeat:
          count: !lambda 'return amount;'

          then:
            - servo.write:
                id: my_servo
                level: !lambda |-
                  return(
                    mode == "${mode_normal}" ? id(normal_level).state :
                    mode == "${mode_extra}" ? id(extra_level).state :
                    id(stop_level).state
                  ) / 100.0;

            - delay: 650ms

            - servo.write: 
                id: my_servo
                level: !lambda 'return id(stop_level).state / 100.0;'

            - delay: 650ms

      - delay: 650ms

      - servo.detach: my_servo

      - lambda: 'id(feeding) = false;'

      - homeassistant.event: 
          event: esphome.fish_feed
          data:
            device: ${friendly_name}
            amount: !lambda 'return std::to_string(amount);'
            mode: !lambda 'return mode;'
            timestamp: !lambda |-
              auto t = id(sntp_time).now();
              char buf[20];
              snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:%02d:%02d",
              t.year, t.month, t.day_of_month,
              t.hour, t.minute, t.second);
              return std::string(buf);

      - lambda: |-
          id(total_feeds)++;
          id(total_feed).publish_state(id(total_feeds));
          auto t = id(sntp_time).now();
          if (t.is_valid()) {
            auto call = id(last_feed_datetime).make_call();
            call.set_datetime(
              t.year,
              t.month,
              t.day_of_month,
              t.hour,
              t.minute,
              t.second
            );
            call.perform();
          }

  - id: update_next_feed_time
    mode: restart
    then: 
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) return;

          int now_mins = now.hour * 60 + now.minute;

          bool day_ok[8] = {
            false,
            id(feed_day_sun).state,
            id(feed_day_mon).state,
            id(feed_day_tue).state,
            id(feed_day_wed).state,
            id(feed_day_thu).state,
            id(feed_day_fri).state,
            id(feed_day_sat).state,
          };

          struct Entry {
            esphome::datetime::TimeEntity* e;
            esphome::switch_::Switch* sw;
            esphome::number::Number* amount;
            esphome::select::Select* mode;
          };

          Entry times[] = {
            {id(feed_time_1), id(feed_time_1_enabled), id(feed_amount_1), id(feed_mode_1)},
            {id(feed_time_2), id(feed_time_2_enabled), id(feed_amount_2), id(feed_mode_2)},
            {id(feed_time_3), id(feed_time_3_enabled), id(feed_amount_3), id(feed_mode_3)},
            {id(feed_time_4), id(feed_time_4_enabled), id(feed_amount_4), id(feed_mode_4)},
            {id(feed_time_5), id(feed_time_5_enabled), id(feed_amount_5), id(feed_mode_5)},
          };

          int best_mins = -1;
          int best_diff = 99999;
          int best_day = -1;
          int best_idx = -1;
          for (int day_offset = 0; day_offset < 7; day_offset++) {
            int dow = (now.day_of_week - 1 + day_offset) % 7 + 1;
            if (!day_ok[dow]) continue;

            for (int i = 0; i < 5; i++) {
              auto& t = times[i];
              if (!t.e->has_state() || !t.sw->state) continue;
              auto et = t.e->state_as_esptime();
              int mins = day_offset * 1440 + et.hour * 60 + et.minute;
              int diff = mins - now_mins;
              if (diff <= 0) continue;
              if (diff < best_diff) {
                best_diff = diff;
                best_mins = et.hour * 60 + et.minute;
                best_day = dow;
                best_idx = i;
              }
            }
            if (best_mins >= 0) break;
          }

          if (best_mins >= 0) {
            id(next_feed_day) = best_day;
            id(next_feed_amount) = (int)times[best_idx].amount->state;
            id(next_feed_mode) = times[best_idx].mode->current_option();

            int target_dow = best_day;
            int days_ahead = (target_dow - now.day_of_week + 7) % 7;
            if (days_ahead == 0 && best_mins <= now.hour * 60 + now.minute) days_ahead = 7;

            struct tm t = {};
            t.tm_year = now.year - 1900;
            t.tm_mon = now.month - 1;
            t.tm_mday = now.day_of_month + days_ahead;
            t.tm_hour = best_mins / 60;
            t.tm_min = best_mins % 60;
            t.tm_sec = 0;
            t.tm_isdst = -1;
            mktime(&t);

            auto call = id(next_feed_datetime).make_call();
            call.set_datetime(
              t.tm_year + 1900,
              t.tm_mon + 1,
              t.tm_mday,
              t.tm_hour,
              t.tm_min,
              0
            );
            call.perform();
          } else {
            id(next_feed_day) = -1;
            id(next_feed_amount) = 0;
            id(next_feed_mode) = "";
          }


