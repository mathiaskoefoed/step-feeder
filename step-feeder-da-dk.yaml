    restore_value: true
    set_action: 
      then:
        - delay: 100ms
        - script.execute: update_next_feed_time
    on_time: 
      - script.execute:
          id: scheduled_feed
          slot: 3
  - platform: template
    id: feed_time_4
    name: ${feed_time_4}
    type: TIME
    optimistic: true
    restore_value: true
    set_action: 
      then:
        - delay: 100ms
        - script.execute: update_next_feed_time
    on_time: 
      - script.execute:
          id: scheduled_feed
          slot: 4
  - platform: template
    id: feed_time_5
    name: ${feed_time_5}
    type: TIME
    optimistic: true
    restore_value: true
    set_action: 
