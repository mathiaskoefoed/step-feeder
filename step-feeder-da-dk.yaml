################################
#        CONFIGURATION         #
################################

substitutions:

  ##############################
  #           DEVICE           #
  ##############################
  name: step-feeder
  friendly_name: Step Feeder
  timezone: Europe/Copenhagen


  ##############################
  #           SERVO            #
  ##############################
  servo_pin: GPIO18
  servo_min_level: 2.5%
  servo_max_level: 24.5%
  initial_normal_level: 18
  initial_extra_level: 28
  initial_stop_level: 5


  ##############################
  #          DISPLAY           #
  ##############################
  display_scl_pin: GPIO14
  display_sda_pin: GPIO23
  display_res_pin: GPIO4
  display_dc_pin: GPIO26
  display_cs_pin: GPIO27
  display_blk_pin: GPIO16


  ##############################
  #        DISPLAY TEXT        #
  ##############################
  display_sunday: "SØNDAG"
  display_monday: "MANDAG"
  display_tuesday: "TIRSDAG"
  display_wednesday: "ONSDAG"
  display_thursday: "TORSDAG"
  display_friday: "FREDAG"
  display_saturday: "LØRDAG"

  display_ready: "KLAR"
  display_pause: "PAUSE"
  display_feeding: "FODRER"
  display_next_feeding: "NÆSTE FODRING"
  display_today: "I DAG"
  display_tomorrow: "I MORGEN"
  display_mode: "MODE"
  display_amount: "Mængde"
  display_wifi: "WiFi"


  ##############################
  #        ENTITY NAMES        #
  ##############################
  feed_time_1: "Fodring Tid 1"
  feed_mode_1: "Foder Mode 1"
  feed_amount_1: "Foder Mængde 1"
  feed_time_1_enabled: "Fodring Tid 1 Aktiv"

  feed_time_2: "Fodring Tid 2"
  feed_mode_2: "Foder Mode 2"
  feed_amount_2: "Foder Mængde 2"
  feed_time_2_enabled: "Fodring Tid 2 Aktiv"

  feed_time_3: "Fodring Tid 3"
  feed_mode_3: "Foder Mode 3"
  feed_amount_3: "Foder Mængde 3"
  feed_time_3_enabled: "Fodring Tid 3 Aktiv"

  feed_time_4: "Fodring Tid 4"
  feed_mode_4: "Foder Mode 4"
  feed_amount_4: "Foder Mængde 4"
  feed_time_4_enabled: "Fodring Tid 4 Aktiv"

  feed_time_5: "Fodring Tid 5"
  feed_mode_5: "Foder Mode 5"
  feed_amount_5: "Foder Mængde 5"
  feed_time_5_enabled: "Fodring Tid 5 Aktiv"

  feed_sunday: "Fodring Søndag"
  feed_monday: "Fodring Mandag"
  feed_tuesday: "Fodring Tirsdag"
  feed_wednesday: "Fodring Onsdag"
  feed_thursday: "Fodring Torsdag"
  feed_friday: "Fodring Fredag"
  feed_saturday: "Fodring Lørdag"

  last_feed: "Sidste Fodring"
  next_feed: "Næste Fodring"

  auto_dim: "Auto Dim Skærm"
  screen_brightness: "Skærm Lysstyrke"
  day_brightness: "Dag Lysstyrke"
  night_brightness: "Nat Lysstyrke"
  night_start: "Nat Start"
  night_end: "Nat Slut"

  running: "Køre"
  total_feed: "Total Fodringer"
  wifi_signal: "WiFi Signal"
  uptime: "Oppe Tid"
  restart: "Restart ESP"
  reset: "Reset"

  mode_normal: "NORMAL"
  mode_extra: "EXTRA"
  mode_pause: "Pause Fodring"

  servo_control: "Servo Control"
  normal_level: "Normal Level"
  extra_level: "Extra Level"
  stop_level: "Stop Level"

################################
#           ESPHOME            #
################################

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  name_add_mac_suffix: false

  on_boot:
    priority: -100
    then:
      - lambda: 'id(feeding) = false;'

      - lambda: 'id(total_feed).publish_state(id(total_feeds));'

      - servo.write: 
          id: my_servo
          level: !lambda 'return id(stop_level).state / 100.0;'

      - delay: 500ms
      - servo.detach: my_servo
      - script.execute: update_next_feed_time
  on_shutdown: 
    then:
      - servo.detach: my_servo

################################
#            ESP32             #
################################

esp32:
  variant: esp32

  framework:
    type: esp-idf

    advanced: 
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

################################
#            SYSTEM            #
################################

logger:
  baud_rate: 0

api:
  reboot_timeout: 0s
  listen_backlog: 1
  max_connections: 2
  max_send_queue: 4
  batch_delay: 50ms
  actions: 
    - action: feed_now
      variables:
        amount: int
        mode: string
        override_pause_mode: bool

      then:
        - if:
            condition:
              lambda: 'return (!id(pause_mode).state || override_pause_mode) && !id(feeding);'
            then:
              - script.execute:
                  id: feed_fish
                  amount: !lambda 'return amount;'
                  mode: !lambda 'return mode;'

    - action: reset_total_feed
      then:
        - lambda: |-
            id(total_feeds) = 0;
            id(total_feed).publish_state(id(total_feeds));

ota:
- platform: esphome


################################
#             WIFI             #
################################

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  reboot_timeout: 0s
  power_save_mode: NONE
  fast_connect: true
  output_power: 18

################################
#             TIME             #
################################

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    update_interval: 60s
    on_time_sync:
      then:
        - script.execute: update_next_feed_time
    on_time: 
      - seconds: 0
        minutes: 0
        hours: 0
        then: 
          - script.execute: update_next_feed_time
      - seconds: 0
        minutes: /1
        then:
          - lambda: |-
              if (!id(auto_dim_enabled).state) return;
              auto now = id(sntp_time).now();
              if (!now.is_valid()) return;
              if (!id(night_start).has_state()) return;
              if (!id(night_end).has_state()) return;
              int now_mins = now.hour * 60 + now.minute;
              auto ns = id(night_start).state_as_esptime();
              auto ne = id(night_end).state_as_esptime();
              int start = ns.hour * 60 + ns.minute;
              int end = ne.hour * 60 + ne.minute;
              bool night = false;
              if (start < end) {
                night = (now_mins >= start && now_mins < end);
              } else {
                night = (now_mins >= start || now_mins < end);
              }

              auto call = id(display_backlight).turn_on();
              call.set_brightness(
              (night
                ? id(night_brightness).state
                : id(day_brightness).state
              ) / 100.0
              );
              call.perform();


